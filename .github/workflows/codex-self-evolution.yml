name: codex-relationship-evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run DeepSeek evolution script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx scripts/deepseek-evolution.ts

      - name: Commit and create PR
        run: |
          git config user.name "DeepSeek Codex"
          git config user.email "codex@tianji.global"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          REPORT_TITLE=$(grep "^# Codex" codex-upgrade-report.md 2>/dev/null | head -1 | sed "s/^# //" || echo "DeepSeek evolution run")
          git commit -m "$REPORT_TITLE"

          git push origin HEAD:refs/heads/codex/deepseek-evolution ||             git push origin codex/deepseek-evolution --force

          gh pr create             --base main             --head codex/deepseek-evolution             --title "$REPORT_TITLE"             --body-file codex-upgrade-report.md             2>/dev/null || echo "PR creation attempted"
