name: Prepare Clean Release Candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/prepare-clean-release.yml
      - scripts/release/prepare-clean-release.mjs
      - scripts/release/verify-clean-release.mjs
  push:
    branches:
      - rescue/production-live-code-20260727
    paths:
      - .github/workflows/prepare-clean-release.yml
      - scripts/release/prepare-clean-release.mjs
      - scripts/release/verify-clean-release.mjs

permissions:
  contents: read

jobs:
  prepare-clean-release:
    name: Build immutable release artifact
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact rescue commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set immutable build timestamp
        shell: bash
        run: echo "RELEASE_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Run release checks in clean test environment
        run: npm run release:check

      - name: Reset exact reviewed source for stamped build
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$RELEASE_COMMIT"
          git clean -fd
          rm -rf .next dist
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Rebuild with immutable version metadata
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          SERVICE_VERSION_COMMIT: ${{ env.RELEASE_COMMIT }}
          SERVICE_VERSION_BUILT_AT: ${{ env.RELEASE_BUILT_AT }}
        run: npm run build

      - name: Build clean release archive
        env:
          SERVICE_VERSION_COMMIT: ${{ env.RELEASE_COMMIT }}
          SERVICE_VERSION_BUILT_AT: ${{ env.RELEASE_BUILT_AT }}
        run: node scripts/release/prepare-clean-release.mjs

      - name: Verify clean release archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dist/clean-release/tianji-love-${RELEASE_COMMIT}.tar.gz"
          node scripts/release/verify-clean-release.mjs "$ARCHIVE" "$RELEASE_COMMIT"

      - name: Upload clean release candidate
        uses: actions/upload-artifact@v4
        with:
          name: tianji-clean-release-${{ env.RELEASE_COMMIT }}
          path: |
            dist/clean-release/tianji-love-${{ env.RELEASE_COMMIT }}.tar.gz
            dist/clean-release/tianji-love-${{ env.RELEASE_COMMIT }}.tar.gz.sha256
            dist/clean-release/release-summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
