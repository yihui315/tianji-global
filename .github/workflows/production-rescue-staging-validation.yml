name: Production Rescue Staging Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-rescue-staging-validation.yml
      - src/lib/ai-orchestrator.ts
      - src/lib/legacy-subscriber-store.ts
      - src/app/api/subscribe/**
      - src/app/api/subscribers/**
      - src/__tests__/api/legacy-subscribe-route.test.ts
      - src/__tests__/lib/legacy-subscriber-store.test.ts

permissions:
  contents: read

jobs:
  degraded-staging-validation:
    runs-on: ubuntu-latest
    env:
      STAGING_DEGRADED_MODE: 'true'
      AI_PROVIDER_LIVE_DISABLED: 'true'
      STRIPE_LIVE_DISABLED: 'true'
      EMAIL_SEND_DISABLED: 'true'
      SUPABASE_MUTATION_DISABLED: 'true'
      SUBSCRIBER_WRITES_DISABLED: 'true'
      NEXT_PUBLIC_APP_ENV: staging
    steps:
      - name: Checkout rescue commit
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify recovered source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/lib/ai-orchestrator.ts)" = "42298f00e9355f56cb79cdcd640e817551dc9de6"
          test "$(sha256sum src/lib/ai-orchestrator.ts | awk '{print $1}')" = "810048466b27f63b6cba5736808e64325edb639b720449ee76b345ea56e2692a"

      - name: Run targeted rescue tests
        run: npx vitest run src/__tests__/api/legacy-subscribe-route.test.ts src/__tests__/lib/legacy-subscriber-store.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build degraded staging bundle
        run: npm run build:staging:degraded

      - name: Audit degraded staging mode
        run: npm run audit:staging:degraded
